[project]
name = "mmss-mcp"
version = "0.1.0"
description = "MMSS Maternal Care MCP Server — UP Hackathon"
requires-python = ">=3.10"

dependencies = [
    "fastmcp==2.14.5",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
mmss-mcp-server = "mmss_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
